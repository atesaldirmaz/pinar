<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASM CNC - Final Simülasyonu (v4.0 - Emin Değilim Modu)</title>
    <style>
        :root { --primary: #2c3e50; --accent: #c0392b; --success: #27ae60; --warning: #f39c12; --light: #ecf0f1; --unsure: #9b59b6; }
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f3; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { background: white; width: 100%; max-width: 800px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .header { background: var(--primary); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .timer { font-size: 1.4rem; font-weight: bold; font-family: monospace; background: rgba(0,0,0,0.2); padding: 5px 15px; border-radius: 6px; }
        .mode-badge { background: var(--warning); color: #2c3e50; padding: 4px 10px; border-radius: 4px; font-size: 0.85rem; font-weight:bold; display: none; }

        .content { padding: 30px; flex-grow: 1; }
        .question-text { font-size: 1.35rem; margin-bottom: 25px; color: #2c3e50; font-weight: 600; line-height: 1.4; }
        
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { padding: 18px; border: 2px solid #e0e0e0; background: white; text-align: left; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-size: 1.05rem; color: #444; }
        .option-btn:hover { background: #f8f9fa; border-color: #bdc3c7; }
        
        .option-btn.selected { border-color: var(--primary); background: #e8f4fc; color: var(--primary); font-weight: 600; }
        .option-btn.correct { border-color: var(--success); background: #d4edda; color: #155724; }
        .option-btn.wrong { border-color: var(--accent); background: #f8d7da; color: #721c24; text-decoration: line-through; }
        
        /* Emin Değilim Checkbox Stili */
        .unsure-container { margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee; display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
        .unsure-box { width: 20px; height: 20px; border: 2px solid #bdc3c7; border-radius: 4px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .unsure-container.active .unsure-box { background: var(--unsure); border-color: var(--unsure); }
        .unsure-container.active .unsure-box::after { content: '✔'; color: white; font-size: 14px; }
        .unsure-text { color: #7f8c8d; font-size: 0.95rem; font-weight: 500; }
        .unsure-container.active .unsure-text { color: var(--unsure); }

        .explanation-box { margin-top: 25px; padding: 20px; background: #fff3cd; border-left: 6px solid var(--warning); color: #856404; display: none; line-height: 1.6; border-radius: 4px; }
        .review-reason { margin-bottom: 10px; font-weight: bold; padding: 5px 10px; border-radius: 4px; display: inline-block; font-size: 0.85rem; }

        .footer { padding: 20px; border-top: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: #fafafa; }
        button.nav-btn { padding: 12px 30px; cursor: pointer; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; transition: background 0.2s; }
        button.nav-btn:hover { background: #34495e; }
        button.nav-btn:disabled { background: #cbd5e0; cursor: not-allowed; }
        button.finish-btn { background: var(--accent); }
        button.finish-btn:hover { background: #a93226; }
        button.review-btn { background: var(--warning); color: #2c3e50; padding: 12px 25px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; }

        #result-screen { display: none; padding: 50px; text-align: center; }
        .score-circle { width: 180px; height: 180px; border-radius: 50%; background: white; color: var(--primary); display: flex; justify-content: center; align-items: center; font-size: 3.5rem; font-weight: bold; margin: 0 auto 30px; border: 8px solid var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        .progress-container { height: 8px; background: #e0e0e0; width: 100%; }
        .progress-bar { height: 100%; background: var(--success); width: 0%; transition: width 0.4s ease; }
    </style>
</head>

        <button class="nav-btn" id="next-btn" onclick="nextQuestion()">İleri →</button>

</div>

<div class="container" id="result-screen">

    // ==============================================================

    let currentQuestionIndex = 0;
    let userAnswers = [];
    let userUnsure = []; // Emin değilim durumlarını tutar
    let timeLeft = 90 * 60; 
    let timerInterval;
    let isExamFinished = false;
    let isReviewMode = false;
    let reviewIndices = []; // İnceleme modunda gösterilecek soru indeksleri
    let reviewIndex = 0; 

    window.onload = function() {
        if(examQuestions.length === 0) {
            document.getElementById('question-text').innerText = "Lütfen soru verilerini koda ekleyin!";
            return;
        }
        userAnswers = new Array(examQuestions.length).fill(null);
        userUnsure = new Array(examQuestions.length).fill(false);
        updateUI(); 
        startTimer(); 
    };

    function startTimer() {
        timerInterval = setInterval(() => {
            if (timeLeft <= 0) { finishExam(); return; }
            timeLeft--;
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            if(timeLeft < 300) document.getElementById('timer').style.color = '#e74c3c';
        }, 1000);
    }

    function toggleUnsure() {
        if (isExamFinished || isReviewMode) return;
        let qIndex = currentQuestionIndex;
        userUnsure[qIndex] = !userUnsure[qIndex];
        updateUnsureUI();
    }

    function updateUnsureUI() {
        const btn = document.getElementById('unsure-btn');
        let qIndex = isReviewMode ? reviewIndices[reviewIndex] : currentQuestionIndex;
        
        if (userUnsure[qIndex]) btn.classList.add('active');
        else btn.classList.remove('active');
    }

    function updateUI() {
        let qIndex = isReviewMode ? reviewIndices[reviewIndex] : currentQuestionIndex;
        let qData = examQuestions[qIndex];
        
        // Başlık ve Mod Ayarları
        if (isReviewMode) {
            document.getElementById('q-number').innerText = `İnceleme ${reviewIndex + 1} / ${reviewIndices.length}`;
            document.getElementById('review-badge').style.display = 'inline-block';
            document.getElementById('timer').style.visibility = 'hidden';
            
            // Neden İncelemede? (Yanlış mı yaptı yoksa Emin mi değildi?)
            const reasonBadge = document.getElementById('review-reason-badge');
            reasonBadge.style.display = 'inline-block';
            
            const isCorrect = userAnswers[qIndex] === qData.correct;
            const isUnsure = userUnsure[qIndex];

            if (!isCorrect) {
                reasonBadge.innerText = "DURUM: YANLIŞ CEVAP";
                reasonBadge.style.background = "#f8d7da";
                reasonBadge.style.color = "#721c24";
            } else if (isCorrect && isUnsure) {
                reasonBadge.innerText = "DURUM: DOĞRU AMA EMİN DEĞİLSİN";
                reasonBadge.style.background = "#e8daef"; // Morumsu
                reasonBadge.style.color = "#6c3483";
            }

            // İnceleme modunda "Emin değilim" butonu tıklanamaz ama durumu gösterir
            document.getElementById('unsure-btn').style.pointerEvents = 'none';
            document.getElementById('unsure-btn').style.opacity = '0.7';

        } else {
            document.getElementById('q-number').innerText = `Soru ${currentQuestionIndex + 1} / ${examQuestions.length}`;
            document.getElementById('review-reason-badge').style.display = 'none';
            document.getElementById('unsure-btn').style.pointerEvents = 'auto';
            document.getElementById('unsure-btn').style.opacity = '1';
        }

        // Progress Bar
        let total = isReviewMode ? reviewIndices.length : examQuestions.length;
        let current = isReviewMode ? reviewIndex : currentQuestionIndex;
        document.getElementById('progress-bar').style.width = `${((current + 1) / total) * 100}%`;

        // Soru Metni
        document.getElementById('question-text').innerText = qData.question;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        // Açıklama Kutusu
        const expBox = document.getElementById('explanation-box');
        expBox.style.display = 'none';
        
        // Şıklar
        qData.options.forEach((opt, index) => {
            const btn = document.createElement('div');
            btn.className = 'option-btn';
            btn.innerText = opt;
            
            if (isReviewMode) {
                btn.style.cursor = 'default';
                if (index === qData.correct) btn.classList.add('correct'); // Doğruyu Yeşil Yap
                else if (index === userAnswers[qIndex]) btn.classList.add('wrong'); // Yanlışı Kırmızı Yap
            } else {
                if (userAnswers[currentQuestionIndex] === index) btn.classList.add('selected');
                btn.onclick = () => selectOption(index);
            }
            container.appendChild(btn);
        });

        // Emin Değilim Butonunu Güncelle
        updateUnsureUI();

        // Açıklama Göster (Sadece İnceleme Modunda)
        if (isReviewMode) {
            expBox.style.display = 'block';
            expBox.innerHTML = `<strong>ANALİZ:</strong><br>${qData.explanation || 'Açıklama mevcut değil.'}`;
        }

        // Navigasyon Butonları
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const finishBtn = document.getElementById('finish-btn');

        if (isReviewMode) {
            prevBtn.disabled = reviewIndex === 0;
            prevBtn.onclick = prevReviewQuestion;
            
            if (reviewIndex === reviewIndices.length - 1) {
                nextBtn.innerText = "Sonuçlara Dön";
                nextBtn.onclick = returnToResults;
            } else {
                nextBtn.innerText = "Sonraki →";
                nextBtn.onclick = nextReviewQuestion;
            }
            finishBtn.style.display = 'none';
            nextBtn.style.display = 'block';
        } else {
            prevBtn.disabled = currentQuestionIndex === 0;
            prevBtn.onclick = prevQuestion;
            nextBtn.innerText = "İleri →";
            nextBtn.onclick = nextQuestion;

            if (currentQuestionIndex === examQuestions.length - 1) {
                nextBtn.style.display = 'none';
                finishBtn.style.display = 'block';
            } else {
                nextBtn.style.display = 'block';
                finishBtn.style.display = 'none';
            }
        }
    }

    function selectOption(index) {
        if (isExamFinished || isReviewMode) return;
        userAnswers[currentQuestionIndex] = index;
        updateUI();
    }

    function nextQuestion() {
        if (currentQuestionIndex < examQuestions.length - 1) { currentQuestionIndex++; updateUI(); }
    }
    function prevQuestion() {
        if (currentQuestionIndex > 0) { currentQuestionIndex--; updateUI(); }
    }
    function nextReviewQuestion() {
        if (reviewIndex < reviewIndices.length - 1) { reviewIndex++; updateUI(); }
    }
    function prevReviewQuestion() {
        if (reviewIndex > 0) { reviewIndex--; updateUI(); }
    }

    function finishExam() {
        clearInterval(timerInterval);
        isExamFinished = true;
        let correctCount = 0;
        let unsureCount = 0;
        reviewIndices = [];

        examQuestions.forEach((q, index) => {
            const isCorrect = userAnswers[index] === q.correct;
            const isUnsure = userUnsure[index];

            if (isCorrect) correctCount++;
            if (isUnsure) unsureCount++;

            // İnceleme listesine ekleme mantığı:
            // 1. Yanlış cevaplar
            // 2. Doğru ama "Emin Değilim" denilen cevaplar
            if (!isCorrect || (isCorrect && isUnsure)) {
                reviewIndices.push(index);
            }
        });

        const score = Math.round((correctCount / examQuestions.length) * 100);
        document.getElementById('main-container').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        
        const scoreCircle = document.getElementById('final-score');
        scoreCircle.innerText = `%${score}`;
        scoreCircle.style.borderColor = score >= 70 ? '#27ae60' : '#c0392b';
        scoreCircle.style.color = score >= 70 ? '#27ae60' : '#c0392b';

        const reviewBtn = document.getElementById('start-review-btn');
        const msg = document.getElementById('result-msg');
        const unsureMsg = document.getElementById('unsure-count-msg');
        
        if (score >= 85) msg.innerText = "Mükemmel! Gerçek sınava hazırsınız.";
        else if (score >= 70) msg.innerText = "Tebrikler, geçtiniz. Ancak %85 üzeri için biraz daha tekrar gerekli.";
        else msg.innerText = "Henüz hazır değilsiniz. Yanlışları analiz edip tekrar deneyin.";

        unsureMsg.innerText = `${unsureCount} soruda emin değildiniz.`;

        if (reviewIndices.length === 0) {
            reviewBtn.style.display = 'none';
            unsureMsg.innerText += " İnceleyecek soru yok, hepsi emin ve doğru!";
        } else {
            reviewBtn.style.display = 'inline-block';
            reviewBtn.innerText = `${reviewIndices.length} Soruyu İncele (Yanlış + Şüpheli)`;
        }
    }

    function startReviewMode() {
        isReviewMode = true;
        reviewIndex = 0;
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('main-container').style.display = 'flex';
        updateUI();
    }
    function returnToResults() {
        document.getElementById('main-container').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
    }
</script>
