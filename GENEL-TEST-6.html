<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASM CNC - Final Simülasyonu (v4.0 - Emin Değilim Modu)</title>
    <style>
        :root { --primary: #2c3e50; --accent: #c0392b; --success: #27ae60; --warning: #f39c12; --light: #ecf0f1; --unsure: #9b59b6; }
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f3; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { background: white; width: 100%; max-width: 800px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .header { background: var(--primary); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .timer { font-size: 1.4rem; font-weight: bold; font-family: monospace; background: rgba(0,0,0,0.2); padding: 5px 15px; border-radius: 6px; }
        .mode-badge { background: var(--warning); color: #2c3e50; padding: 4px 10px; border-radius: 4px; font-size: 0.85rem; font-weight:bold; display: none; }

        .content { padding: 30px; flex-grow: 1; }
        .question-text { font-size: 1.35rem; margin-bottom: 25px; color: #2c3e50; font-weight: 600; line-height: 1.4; }
        
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { padding: 18px; border: 2px solid #e0e0e0; background: white; text-align: left; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-size: 1.05rem; color: #444; }
        .option-btn:hover { background: #f8f9fa; border-color: #bdc3c7; }
        
        .option-btn.selected { border-color: var(--primary); background: #e8f4fc; color: var(--primary); font-weight: 600; }
        .option-btn.correct { border-color: var(--success); background: #d4edda; color: #155724; }
        .option-btn.wrong { border-color: var(--accent); background: #f8d7da; color: #721c24; text-decoration: line-through; }
        
        /* Emin Değilim Checkbox Stili */
        .unsure-container { margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee; display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
        .unsure-box { width: 20px; height: 20px; border: 2px solid #bdc3c7; border-radius: 4px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .unsure-container.active .unsure-box { background: var(--unsure); border-color: var(--unsure); }
        .unsure-container.active .unsure-box::after { content: '✔'; color: white; font-size: 14px; }
        .unsure-text { color: #7f8c8d; font-size: 0.95rem; font-weight: 500; }
        .unsure-container.active .unsure-text { color: var(--unsure); }

        .explanation-box { margin-top: 25px; padding: 20px; background: #fff3cd; border-left: 6px solid var(--warning); color: #856404; display: none; line-height: 1.6; border-radius: 4px; }
        .review-reason { margin-bottom: 10px; font-weight: bold; padding: 5px 10px; border-radius: 4px; display: inline-block; font-size: 0.85rem; }

        .footer { padding: 20px; border-top: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: #fafafa; }
        button.nav-btn { padding: 12px 30px; cursor: pointer; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; transition: background 0.2s; }
        button.nav-btn:hover { background: #34495e; }
        button.nav-btn:disabled { background: #cbd5e0; cursor: not-allowed; }
        button.finish-btn { background: var(--accent); }
        button.finish-btn:hover { background: #a93226; }
        button.review-btn { background: var(--warning); color: #2c3e50; padding: 12px 25px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; }

        #result-screen { display: none; padding: 50px; text-align: center; }
        .score-circle { width: 180px; height: 180px; border-radius: 50%; background: white; color: var(--primary); display: flex; justify-content: center; align-items: center; font-size: 3.5rem; font-weight: bold; margin: 0 auto 30px; border: 8px solid var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        .progress-container { height: 8px; background: #e0e0e0; width: 100%; }
        .progress-bar { height: 100%; background: var(--success); width: 0%; transition: width 0.4s ease; }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="header">
        <div style="display:flex; flex-direction:column;">
            <span style="font-size:0.9rem; opacity:0.8;">NASM CNC SİMÜLASYON v4.0</span>
            <div style="display:flex; gap:10px; align-items:center;">
                <span id="q-number" style="font-weight:bold;">Soru 1</span>
                <span class="mode-badge" id="review-badge">İNCELEME MODU</span>
            </div>
        </div>
        <div class="timer" id="timer">90:00</div>
    </div>
    
    <div class="content">
        <div class="question-text" id="question-text">Soru verisi yükleniyor...</div>
        
        <div id="review-reason-badge" style="display:none; margin-bottom:15px;"></div>

        <div class="options" id="options-container"></div>
        
        <div class="unsure-container" id="unsure-btn" onclick="toggleUnsure()">
            <div class="unsure-box"></div>
            <span class="unsure-text">Bu cevaptan emin değilim (İşaretle)</span>
        </div>

        <div class="explanation-box" id="explanation-box"></div>
    </div>

    <div class="footer">
        <button class="nav-btn" id="prev-btn" onclick="prevQuestion()">← Geri</button>
        <button class="nav-btn finish-btn" id="finish-btn" onclick="finishExam()" style="display:none;">SINAVI BİTİR</button>
        <button class="nav-btn" id="next-btn" onclick="nextQuestion()">İleri →</button>
    </div>
</div>

<div class="container" id="result-screen">
    <h2 style="color:var(--primary); margin-bottom:30px;">Sınav Sonucu</h2>
    <div class="score-circle" id="final-score">--</div>
    <p id="result-msg" style="font-size:1.2rem; color:#555; margin-bottom:10px;"></p>
    <p id="unsure-count-msg" style="font-size:1rem; color:#9b59b6; margin-bottom:30px;"></p>
    
    <div style="display:flex; justify-content:center; gap:15px; flex-wrap:wrap;">
        <button class="review-btn" id="start-review-btn" onclick="startReviewMode()">YANLIŞ VE ŞÜPHELİLERİ İNCELE</button>
        <button class="nav-btn" onclick="location.reload()">YENİDEN BAŞLAT</button>
    </div>
</div>

<script>
    // ==============================================================
    // VERİ ALANI - BURAYI DOLDURACAĞIZ
    // ==============================================================
    const examQuestions = [{
        "id": 1,
        "category": "Beslenme Bilimi",
        "question": "NASM Standartlarına göre, bir Beslenme Koçu (Nutrition Coach) için aşağıdaki eylemlerden hangisi kesinlikle 'Yetki Alanı' (Scope of Practice) dışındadır ve yasal risk taşır?",
        "options": [
            "Danışanlara, genel nüfus için geçerli olan sağlıklı beslenme kılavuzlarına dayanarak makro besin tavsiyelerinde bulunmak.",
            "Bir danışanın kan tahlillerine bakarak ona 'Tip 2 Diyabet' teşhisi koymak ve kan şekerini düşürmesi için özel bir tıbbi diyet listesi yazmak.",
            "Farklı protein kaynaklarının (bitkisel vs hayvansal) avantajlarını ve dezavantajlarını bilimsel verilere dayanarak tartışmak.",
            "Danışanlara 'Porsiyon Kontrolü' stratejilerini (el rehberi vb.) öğreterek kalori alımlarını yönetmelerine yardımcı olmak."
        ],
        "correct": 1,
        "explanation": "ANALİZ: B şıkkı 'Teşhis' ve 'Tedavi' içerir. Bu sadece Doktorların ve Kayıtlı Diyetisyenlerin (RD) yetkisindedir. Koçlar 'Rehberlik' eder, 'Tedavi' etmez."
    },
    {
        "id": 2,
        "category": "Beslenme Bilimi",
        "question": "Enerji metabolizması hesaplanırken, 1 gram Protein ve 1 gram Karbonhidratın vücuda sağladığı enerji miktarı sırasıyla kaçtır?",
        "options": [
            "4 kalori (Protein) ve 9 kalori (Karbonhidrat).",
            "9 kalori (Protein) ve 4 kalori (Karbonhidrat).",
            "4 kalori (Protein) ve 4 kalori (Karbonhidrat).",
            "7 kalori (Protein) ve 4 kalori (Karbonhidrat)."
        ],
        "correct": 2,
        "explanation": "ANALİZ: C şıkkı doğrudur. Proteinler ve Karbonhidratlar 4 kcal/g enerji sağlar. Yağlar 9 kcal/g, Alkol ise 7 kcal/g enerji sağlar."
    },
    {
        "id": 3,
        "category": "Beslenme Bilimi",
        "question": "Termodinamiğin Birinci Yasası (Enerji Korunumu), beslenme ve kilo yönetimi bağlamında temel olarak neyi ifade eder?",
        "options": [
            "Enerji yoktan var edilemez ve yok edilemez; sadece dönüştürülür. Kilo değişimi, alınan kalori ile harcanan kalori arasındaki dengeye bağlıdır.",
            "Kilo vermek için termodinamik yasalara göre karbonhidratları tamamen kesmek ve sadece yağ yakımına odaklanmak gerekir.",
            "Proteinler vücutta enerjiye dönüşemez, sadece yapı taşı olarak kullanılır, bu yüzden kalori hesabına katılmazlar.",
            "Metabolizma hızı yaşla birlikte artar, bu da termodinamik dengenin bozulmasına ve kendiliğinden kilo kaybına neden olur."
        ],
        "correct": 0,
        "explanation": "ANALİZ: A şıkkı doğrudur. Yasa 'Enerji Dengesi'ni açıklar. Giren Enerji > Çıkan Enerji = Kilo Alımı. Giren < Çıkan = Kilo Kaybı."
    },
    {
        "id": 4,
        "category": "Beslenme Bilimi",
        "question": "Toplam Günlük Enerji Harcamasının (TDEE) bileşenleri düşünüldüğünde, günlük harcanan kalorinin en büyük kısmını (%60-75) hangisi oluşturur?",
        "options": [
            "Besinlerin Termik Etkisi (TEF) - Sindirim için harcanan enerji.",
            "Egzersiz Aktivitesi Termojenezi (EAT) - Spor yaparken harcanan enerji.",
            "Dinlenme Metabolik Hızı (RMR) - Vücudun hayatta kalmak için harcadığı temel enerji.",
            "Egzersiz Dışı Aktivite Termojenezi (NEAT) - Yürüme, ayakta durma gibi aktiviteler."
        ],
        "correct": 2,
        "explanation": "ANALİZ: C şıkkı doğrudur. Hiç hareket etmeseniz bile organlarınızın çalışması için gereken enerji (RMR), toplam harcamanın en büyük kısmıdır."
    },
    {
        "id": 5,
        "category": "Beslenme Bilimi",
        "question": "Vücut tarafından sentezlenemeyen (üretilemeyen) ve mutlaka besinler yoluyla dışarıdan alınması zorunlu olan amino asit grubuna ne ad verilir?",
        "options": [
            "Esansiyel Olmayan (Non-Essential) Amino Asitler.",
            "Esansiyel (Essential / Elzem) Amino Asitler.",
            "Koşullu Esansiyel (Conditionally Essential) Amino Asitler.",
            "Dallı Zincirli Amino Asitler (BCAA)."
        ],
        "correct": 1,
        "explanation": "ANALİZ: B şıkkı doğrudur. 'Esansiyel' kelimesi biyolojide 'Vücut yapamaz, dışarıdan al' demektir. 9 adet esansiyel amino asit vardır."
    },
    {
        "id": 6,
        "category": "Beslenme Bilimi",
        "question": "Aşağıdakilerden hangisi, vücudun ihtiyaç duyduğu tüm esansiyel amino asitleri yeterli miktarda içeren 'Tam Protein' (Complete Protein) kaynağına örnektir?",
        "options": [
            "Beyaz Pirinç (Lizin amino asidi eksiktir).",
            "Fıstık Ezmesi (Metiyonin amino asidi eksiktir).",
            "Yumurta (Tüm esansiyel amino asitleri tam profilde içerir).",
            "Tam Buğday Ekmeği (Lizin amino asidi eksiktir)."
        ],
        "correct": 2,
        "explanation": "ANALİZ: C şıkkı doğrudur. Hayvansal kaynaklar (et, süt, yumurta) genellikle tam proteindir. Bitkisel kaynaklarda (soya hariç) genellikle 1-2 amino asit eksiktir."
    },
    {
        "id": 7,
        "category": "Beslenme Bilimi",
        "question": "Vücuttaki Glikojen (karbonhidrat deposu) temel olarak hangi iki dokuda depolanır ve kullanılır?",
        "options": [
            "Karaciğer (kan şekerini dengelemek için) ve Kaslar (hareket enerjisi için).",
            "Pankreas (insülin üretimi için) ve Kan Dolaşımı.",
            "Mide (sindirim için) ve İnce Bağırsak.",
            "Adipoz Doku (yağ deposu olarak) ve Beyin."
        ],
        "correct": 0,
        "explanation": "ANALİZ: A şıkkı doğrudur. Karaciğerdeki glikojen tüm vücut (beyin) için kullanılır. Kaslardaki glikojen sadece o kasın çalışması için kullanılır."
    },
    {
        "id": 8,
        "category": "Beslenme Bilimi",
        "question": "Makro besinler arasında enerji yoğunluğu en yüksek olan Yağların (Lipitlerin) gram başına sağladığı enerji miktarı nedir?",
        "options": [
            "4 kalori",
            "7 kalori",
            "9 kalori",
            "12 kalori"
        ],
        "correct": 2,
        "explanation": "ANALİZ: C şıkkı doğrudur. Yağlar 9 kcal/g enerji verir. Bu yüzden porsiyon hacmi küçük olsa bile kalorisi yüksektir."
    },
    {
        "id": 9,
        "category": "Beslenme Bilimi",
        "question": "NEAT (Non-Exercise Activity Thermogenesis) kavramı tam olarak hangi aktiviteleri kapsar?",
        "options": [
            "Derin uyku sırasında vücudun harcadığı bazal enerjiyi.",
            "Spor salonunda yapılan planlı ve tempolu egzersizleri (koşu bandı, ağırlık kaldırma).",
            "Besinlerin sindirimi ve emilimi sırasında harcanan enerjiyi.",
            "Planlı spor dışındaki tüm günlük hareketleri (işe yürümek, ayakta durmak, ev işi yapmak, kıpırdanmak)."
        ],
        "correct": 3,
        "explanation": "ANALİZ: D şıkkı doğrudur. NEAT, spor yapmadan harcanan kaloridir ve metabolizmayı canlı tutmak için kritik öneme sahiptir."
    },
    {
        "id": 10,
        "category": "Beslenme Bilimi",
        "question": "Kalp sağlığı üzerindeki olumsuz etkileri nedeniyle, diyette tüketiminin en aza indirilmesi veya tamamen kaçınılması önerilen yağ türü hangisidir?",
        "options": [
            "Tekli Doymamış Yağlar (Zeytinyağı, Avokado).",
            "Endüstriyel Trans Yağlar (Kısmi hidrojenize yağlar, margarinler).",
            "Çoklu Doymamış Yağlar (Balık yağı, Ceviz).",
            "Omega-3 Yağ Asitleri (EPA, DHA)."
        ],
        "correct": 1,
        "explanation": "ANALİZ: B şıkkı doğrudur. Trans yağlar LDL'yi (kötü kolesterol) artırır, HDL'yi (iyi) düşürür. Sağlık için 'güvenli' bir alt limiti yoktur, sıfır olmalıdır."
    },
    {
        "id": 11,
        "category": "Beslenme Bilimi",
        "question": "Alkolün vücutta bir besin değeri (vitamin/mineral) sağlamamasına rağmen gram başına verdiği enerji değeri nedir?",
        "options": [
            "0 kalori (Su gibi etki eder).",
            "4 kalori (Karbonhidrat gibi etki eder).",
            "7 kalori (Yağa yakın, proteinden yüksek enerji verir).",
            "9 kalori (Saf yağ gibi enerji verir)."
        ],
        "correct": 2,
        "explanation": "ANALİZ: C şıkkı doğrudur. Alkol 'Boş Kalori'dir. 1 gramı 7 kalori verir ama beslemez."
    },
    {
        "id": 12,
        "category": "Davranış Değişikliği",
        "question": "Bir koçun danışanını dinlediğini ve anladığını göstermek için kullandığı 'Yansıtıcı Dinleme' (Reflective Listening) tekniği nasıl uygulanır?",
        "options": [
            "Danışanın sözünü kesip, ona kendi hayatından bir örnek vererek tavsiyede bulunmak.",
            "Danışanın anlattığı duyguyu veya durumu kendi cümleleriyle özetleyerek ona geri bildirmek (örn: 'Yani diyorsun ki...').",
            "Sadece başını sallayarak sessiz kalmak ve not almak.",
            "Konuyu hemen değiştirip bir sonraki soruya geçmek."
        ],
        "correct": 1,
        "explanation": "ANALİZ: B şıkkı doğrudur. Yansıtma, bir ayna görevi görür. Danışan kendi düşüncelerini dışarıdan duyar ve 'Evet, aynen öyle hissediyorum' der."
    },
    {
        "id": 13,
        "category": "Beslenme Bilimi",
        "question": "Kan şekeri seviyesini çok hızlı yükselten (High Spike) karbonhidratların 'Glisemik İndeksi' (GI) nasıl sınıflandırılır?",
        "options": [
            "Yüksek Glisemik İndeks (High GI) - Örn: Beyaz ekmek, şeker.",
            "Düşük Glisemik İndeks (Low GI) - Örn: Baklagiller.",
            "Nötr Glisemik İndeks - Kan şekerini etkilemez.",
            "Negatif Glisemik İndeks - Kan şekerini düşürür."
        ],
        "correct": 0,
        "explanation": "ANALİZ: A şıkkı doğrudur. Hızlı sindirilen ve kana hemen karışan şekerler Yüksek GI'lidir. Bu, insülin dalgalanmalarına ve çabuk acıkmaya neden olur."
    },
    {
        "id": 14,
        "category": "Beslenme Bilimi",
        "question": "Proteinlerin sindirim süreci tamamlandığında, kana karışan ve hücreler tarafından kullanılan en küçük yapı taşı nedir?",
        "options": [
            "Glikoz (Şeker molekülleri).",
            "Yağ Asitleri (Trigliseritler).",
            "Amino Asitler (Peptit bağları kopmuş protein parçaları).",
            "Gliserol."
        ],
        "correct": 2,
        "explanation": "ANALİZ: C şıkkı doğrudur. Protein bir trendir, amino asitler vagonlardır. Sindirim, vagonları birbirinden ayırma işlemidir."
    },
    {
        "id": 15,
        "category": "Beslenme Bilimi",
        "question": "Besinlerin Termik Etkisi (TEF), yani yediğimiz yemeği sindirmek için harcadığımız enerji, Toplam Günlük Enerji Harcamasının yaklaşık yüzde kaçını oluşturur?",
        "options": [
            "%0-5 (İhmal edilebilir düzeyde).",
            "%10 (Ortalama bir diyette genel kabul gören oran).",
            "%30 (Çok yüksek bir oran).",
            "%50 (Enerjinin yarısı sindirime gider)."
        ],
        "correct": 1,
        "explanation": "ANALİZ: B şıkkı doğrudur. Karma bir diyette (protein, yağ, karb) alınan kalorinin %10'u sindirim masrafına gider."
    },
    {
        "id": 16,
        "category": "Beslenme Koçluğu",
        "question": "'Kanıta Dayalı Uygulama' (Evidence-Based Practice) yaklaşımı, kararların neye dayandırılmasını gerektirir?",
        "options": [
            "Sadece koçun kişisel deneyimlerine ve inançlarına.",
            "Sosyal medyadaki popüler trendlere ve influencer tavsiyelerine.",
            "En güncel Bilimsel Araştırmalara, Profesyonel Uzmanlığa ve Danışanın Tercihlerine.",
            "Sadece laboratuvar sonuçlarına ve kan testlerine."
        ],
        "correct": 2,
        "explanation": "ANALİZ: C şıkkı doğrudur. Bu bir üçlü saç ayağıdır: Bilim + Tecrübe + Danışanın Değerleri. Sadece biri eksik olursa koçluk eksik kalır."
    },
    {
        "id": 17,
        "category": "Beslenme Bilimi",
        "question": "Su tüketimi için genel bir kılavuz olarak, ılıman bir iklimde yaşayan sedanter (hareketsiz) yetişkin bir erkek için önerilen günlük toplam sıvı alımı (gıdalar dahil) yaklaşık ne kadardır?",
        "options": [
            "1.5 Litre (Yetersiz olabilir).",
            "2.0 Litre (Kadınlar için alt sınır).",
            "3.7 Litre (Yaklaşık 15.5 bardak - NASM/IOM standardı).",
            "5.0 Litre (Aşırı olabilir)."
        ],
        "correct": 2,
        "explanation": "ANALİZ: C şıkkı doğrudur. Erkekler için 3.7L, Kadınlar için 2.7L genel referans değerdir. (Bunun %20'si yiyeceklerden gelir)."
    },
    {
        "id": 18,
        "category": "Beslenme Bilimi",
        "question": "ATP (Adenozin Trifosfat) molekülünün vücuttaki temel biyolojik görevi nedir?",
        "options": [
            "Hücresel enerji para birimidir; besinlerden elde edilen enerjiyi hücrenin kullanabileceği forma taşır.",
            "Sadece yağ dokusunda uzun süreli enerji depolamaya yarar.",
            "Kemik yapısını güçlendirerek iskelet sistemini destekler.",
            "Kanın pıhtılaşmasını sağlayan ana proteindir."
        ],
        "correct": 0,
        "explanation": "ANALİZ: A şıkkı doğrudur. Vücut dolar veya euro kullanmaz, ATP kullanır. Yediğimiz her şey (protein, yağ, karb) ATP'ye dönüşmek zorundadır."
    },
    {
        "id": 19,
        "category": "Beslenme Bilimi",
        "question": "Ketojenik diyetin (Keto) makro besin dağılımındaki temel prensibi nedir?",
        "options": [
            "Yüksek karbonhidrat, düşük yağ, orta protein.",
            "Yüksek protein, sıfır yağ, orta karbonhidrat.",
            "Çok düşük karbonhidrat (%5-10), çok yüksek yağ (%70-75) ve orta protein.",
            "Sadece sıvı besinlerden oluşan detoks diyeti."

    let currentQuestionIndex = 0;
    let userAnswers = [];
    let userUnsure = []; // Emin değilim durumlarını tutar
    let timeLeft = 90 * 60; 
    let timerInterval;
    let isExamFinished = false;
    let isReviewMode = false;
    let reviewIndices = []; // İnceleme modunda gösterilecek soru indeksleri
    let reviewIndex = 0; 

    window.onload = function() {
        if(examQuestions.length === 0) {
            document.getElementById('question-text').innerText = "Lütfen soru verilerini koda ekleyin!";
            return;
        }
        userAnswers = new Array(examQuestions.length).fill(null);
        userUnsure = new Array(examQuestions.length).fill(false);
        updateUI(); 
        startTimer(); 
    };

    function startTimer() {
        timerInterval = setInterval(() => {
            if (timeLeft <= 0) { finishExam(); return; }
            timeLeft--;
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            if(timeLeft < 300) document.getElementById('timer').style.color = '#e74c3c';
        }, 1000);
    }

    function toggleUnsure() {
        if (isExamFinished || isReviewMode) return;
        let qIndex = currentQuestionIndex;
        userUnsure[qIndex] = !userUnsure[qIndex];
        updateUnsureUI();
    }

    function updateUnsureUI() {
        const btn = document.getElementById('unsure-btn');
        let qIndex = isReviewMode ? reviewIndices[reviewIndex] : currentQuestionIndex;
        
        if (userUnsure[qIndex]) btn.classList.add('active');
        else btn.classList.remove('active');
    }

    function updateUI() {
        let qIndex = isReviewMode ? reviewIndices[reviewIndex] : currentQuestionIndex;
        let qData = examQuestions[qIndex];
        
        // Başlık ve Mod Ayarları
        if (isReviewMode) {
            document.getElementById('q-number').innerText = `İnceleme ${reviewIndex + 1} / ${reviewIndices.length}`;
            document.getElementById('review-badge').style.display = 'inline-block';
            document.getElementById('timer').style.visibility = 'hidden';
            
            // Neden İncelemede? (Yanlış mı yaptı yoksa Emin mi değildi?)
            const reasonBadge = document.getElementById('review-reason-badge');
            reasonBadge.style.display = 'inline-block';
            
            const isCorrect = userAnswers[qIndex] === qData.correct;
            const isUnsure = userUnsure[qIndex];

            if (!isCorrect) {
                reasonBadge.innerText = "DURUM: YANLIŞ CEVAP";
                reasonBadge.style.background = "#f8d7da";
                reasonBadge.style.color = "#721c24";
            } else if (isCorrect && isUnsure) {
                reasonBadge.innerText = "DURUM: DOĞRU AMA EMİN DEĞİLSİN";
                reasonBadge.style.background = "#e8daef"; // Morumsu
                reasonBadge.style.color = "#6c3483";
            }

            // İnceleme modunda "Emin değilim" butonu tıklanamaz ama durumu gösterir
            document.getElementById('unsure-btn').style.pointerEvents = 'none';
            document.getElementById('unsure-btn').style.opacity = '0.7';

        } else {
            document.getElementById('q-number').innerText = `Soru ${currentQuestionIndex + 1} / ${examQuestions.length}`;
            document.getElementById('review-reason-badge').style.display = 'none';
            document.getElementById('unsure-btn').style.pointerEvents = 'auto';
            document.getElementById('unsure-btn').style.opacity = '1';
        }

        // Progress Bar
        let total = isReviewMode ? reviewIndices.length : examQuestions.length;
        let current = isReviewMode ? reviewIndex : currentQuestionIndex;
        document.getElementById('progress-bar').style.width = `${((current + 1) / total) * 100}%`;

        // Soru Metni
        document.getElementById('question-text').innerText = qData.question;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        // Açıklama Kutusu
        const expBox = document.getElementById('explanation-box');
        expBox.style.display = 'none';
        
        // Şıklar
        qData.options.forEach((opt, index) => {
            const btn = document.createElement('div');
            btn.className = 'option-btn';
            btn.innerText = opt;
            
            if (isReviewMode) {
                btn.style.cursor = 'default';
                if (index === qData.correct) btn.classList.add('correct'); // Doğruyu Yeşil Yap
                else if (index === userAnswers[qIndex]) btn.classList.add('wrong'); // Yanlışı Kırmızı Yap
            } else {
                if (userAnswers[currentQuestionIndex] === index) btn.classList.add('selected');
                btn.onclick = () => selectOption(index);
            }
            container.appendChild(btn);
        });

        // Emin Değilim Butonunu Güncelle
        updateUnsureUI();

        // Açıklama Göster (Sadece İnceleme Modunda)
        if (isReviewMode) {
            expBox.style.display = 'block';
            expBox.innerHTML = `<strong>ANALİZ:</strong><br>${qData.explanation || 'Açıklama mevcut değil.'}`;
        }

        // Navigasyon Butonları
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const finishBtn = document.getElementById('finish-btn');

        if (isReviewMode) {
            prevBtn.disabled = reviewIndex === 0;
            prevBtn.onclick = prevReviewQuestion;
            
            if (reviewIndex === reviewIndices.length - 1) {
                nextBtn.innerText = "Sonuçlara Dön";
                nextBtn.onclick = returnToResults;
            } else {
                nextBtn.innerText = "Sonraki →";
                nextBtn.onclick = nextReviewQuestion;
            }
            finishBtn.style.display = 'none';
            nextBtn.style.display = 'block';
        } else {
            prevBtn.disabled = currentQuestionIndex === 0;
            prevBtn.onclick = prevQuestion;
            nextBtn.innerText = "İleri →";
            nextBtn.onclick = nextQuestion;

            if (currentQuestionIndex === examQuestions.length - 1) {
                nextBtn.style.display = 'none';
                finishBtn.style.display = 'block';
            } else {
                nextBtn.style.display = 'block';
                finishBtn.style.display = 'none';
            }
        }
    }

    function selectOption(index) {
        if (isExamFinished || isReviewMode) return;
        userAnswers[currentQuestionIndex] = index;
        updateUI();
    }

    function nextQuestion() {
        if (currentQuestionIndex < examQuestions.length - 1) { currentQuestionIndex++; updateUI(); }
    }
    function prevQuestion() {
        if (currentQuestionIndex > 0) { currentQuestionIndex--; updateUI(); }
    }
    function nextReviewQuestion() {
        if (reviewIndex < reviewIndices.length - 1) { reviewIndex++; updateUI(); }
    }
    function prevReviewQuestion() {
        if (reviewIndex > 0) { reviewIndex--; updateUI(); }
    }

    function finishExam() {
        clearInterval(timerInterval);
        isExamFinished = true;
        let correctCount = 0;
        let unsureCount = 0;
        reviewIndices = [];

        examQuestions.forEach((q, index) => {
            const isCorrect = userAnswers[index] === q.correct;
            const isUnsure = userUnsure[index];

            if (isCorrect) correctCount++;
            if (isUnsure) unsureCount++;

            // İnceleme listesine ekleme mantığı:
            // 1. Yanlış cevaplar
            // 2. Doğru ama "Emin Değilim" denilen cevaplar
            if (!isCorrect || (isCorrect && isUnsure)) {
                reviewIndices.push(index);
            }
        });

        const score = Math.round((correctCount / examQuestions.length) * 100);
        document.getElementById('main-container').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        
        const scoreCircle = document.getElementById('final-score');
        scoreCircle.innerText = `%${score}`;
        scoreCircle.style.borderColor = score >= 70 ? '#27ae60' : '#c0392b';
        scoreCircle.style.color = score >= 70 ? '#27ae60' : '#c0392b';

        const reviewBtn = document.getElementById('start-review-btn');
        const msg = document.getElementById('result-msg');
        const unsureMsg = document.getElementById('unsure-count-msg');
        
        if (score >= 85) msg.innerText = "Mükemmel! Gerçek sınava hazırsınız.";
        else if (score >= 70) msg.innerText = "Tebrikler, geçtiniz. Ancak %85 üzeri için biraz daha tekrar gerekli.";
        else msg.innerText = "Henüz hazır değilsiniz. Yanlışları analiz edip tekrar deneyin.";

        unsureMsg.innerText = `${unsureCount} soruda emin değildiniz.`;

        if (reviewIndices.length === 0) {
            reviewBtn.style.display = 'none';
            unsureMsg.innerText += " İnceleyecek soru yok, hepsi emin ve doğru!";
        } else {
            reviewBtn.style.display = 'inline-block';
            reviewBtn.innerText = `${reviewIndices.length} Soruyu İncele (Yanlış + Şüpheli)`;
        }
    }

    function startReviewMode() {
        isReviewMode = true;
        reviewIndex = 0;
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('main-container').style.display = 'flex';
        updateUI();
    }
    function returnToResults() {
        document.getElementById('main-container').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
    }
</script>
</body>
</html>
