            document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            if(timeLeft < 300) document.getElementById('timer').style.color = '#e74c3c';
        }, 1000);
    }

    function toggleUnsure() {
        if (isExamFinished || isReviewMode) return;
        let qIndex = currentQuestionIndex;
        userUnsure[qIndex] = !userUnsure[qIndex];
        updateUnsureUI();
    }

    function updateUnsureUI() {
        const btn = document.getElementById('unsure-btn');
        let qIndex = isReviewMode ? reviewIndices[reviewIndex] : currentQuestionIndex;
        
        if (userUnsure[qIndex]) btn.classList.add('active');
        else btn.classList.remove('active');
    }

    function updateUI() {
        let qIndex = isReviewMode ? reviewIndices[reviewIndex] : currentQuestionIndex;
        let qData = examQuestions[qIndex];
        
        // Başlık ve Mod Ayarları
        if (isReviewMode) {
            document.getElementById('q-number').innerText = `İnceleme ${reviewIndex + 1} / ${reviewIndices.length}`;
            document.getElementById('review-badge').style.display = 'inline-block';
            document.getElementById('timer').style.visibility = 'hidden';
            
            // Neden İncelemede? (Yanlış mı yaptı yoksa Emin mi değildi?)
            const reasonBadge = document.getElementById('review-reason-badge');
            reasonBadge.style.display = 'inline-block';
            
            const isCorrect = userAnswers[qIndex] === qData.correct;
            const isUnsure = userUnsure[qIndex];

            if (!isCorrect) {
                reasonBadge.innerText = "DURUM: YANLIŞ CEVAP";
                reasonBadge.style.background = "#f8d7da";
                reasonBadge.style.color = "#721c24";
            } else if (isCorrect && isUnsure) {
                reasonBadge.innerText = "DURUM: DOĞRU AMA EMİN DEĞİLSİN";
                reasonBadge.style.background = "#e8daef"; // Morumsu
                reasonBadge.style.color = "#6c3483";
            }

            // İnceleme modunda "Emin değilim" butonu tıklanamaz ama durumu gösterir
            document.getElementById('unsure-btn').style.pointerEvents = 'none';
            document.getElementById('unsure-btn').style.opacity = '0.7';

        } else {
            document.getElementById('q-number').innerText = `Soru ${currentQuestionIndex + 1} / ${examQuestions.length}`;
            document.getElementById('review-reason-badge').style.display = 'none';
            document.getElementById('unsure-btn').style.pointerEvents = 'auto';
            document.getElementById('unsure-btn').style.opacity = '1';
        }

        // Progress Bar
        let total = isReviewMode ? reviewIndices.length : examQuestions.length;
        let current = isReviewMode ? reviewIndex : currentQuestionIndex;
        document.getElementById('progress-bar').style.width = `${((current + 1) / total) * 100}%`;

        // Soru Metni
        document.getElementById('question-text').innerText = qData.question;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        // Açıklama Kutusu
        const expBox = document.getElementById('explanation-box');
        expBox.style.display = 'none';
        
        // Şıklar
        qData.options.forEach((opt, index) => {
            const btn = document.createElement('div');
            btn.className = 'option-btn';
            btn.innerText = opt;
            
            if (isReviewMode) {
                btn.style.cursor = 'default';
                if (index === qData.correct) btn.classList.add('correct'); // Doğruyu Yeşil Yap
                else if (index === userAnswers[qIndex]) btn.classList.add('wrong'); // Yanlışı Kırmızı Yap
            } else {
                if (userAnswers[currentQuestionIndex] === index) btn.classList.add('selected');
                btn.onclick = () => selectOption(index);
            }
            container.appendChild(btn);
        });

        // Emin Değilim Butonunu Güncelle
        updateUnsureUI();

        // Açıklama Göster (Sadece İnceleme Modunda)
        if (isReviewMode) {
            expBox.style.display = 'block';
            expBox.innerHTML = `<strong>ANALİZ:</strong><br>${qData.explanation || 'Açıklama mevcut değil.'}`;
        }

        // Navigasyon Butonları
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const finishBtn = document.getElementById('finish-btn');

        if (isReviewMode) {
            prevBtn.disabled = reviewIndex === 0;
            prevBtn.onclick = prevReviewQuestion;
            
            if (reviewIndex === reviewIndices.length - 1) {
                nextBtn.innerText = "Sonuçlara Dön";
                nextBtn.onclick = returnToResults;
            } else {
                nextBtn.innerText = "Sonraki →";
                nextBtn.onclick = nextReviewQuestion;
            }
            finishBtn.style.display = 'none';
            nextBtn.style.display = 'block';
        } else {
            prevBtn.disabled = currentQuestionIndex === 0;
            prevBtn.onclick = prevQuestion;
            nextBtn.innerText = "İleri →";
            nextBtn.onclick = nextQuestion;

            if (currentQuestionIndex === examQuestions.length - 1) {
                nextBtn.style.display = 'none';
                finishBtn.style.display = 'block';
            } else {
                nextBtn.style.display = 'block';
                finishBtn.style.display = 'none';
            }
        }
    }

    function selectOption(index) {
        if (isExamFinished || isReviewMode) return;
        userAnswers[currentQuestionIndex] = index;
        updateUI();
    }

    function nextQuestion() {
        if (currentQuestionIndex < examQuestions.length - 1) { currentQuestionIndex++; updateUI(); }
    }
    function prevQuestion() {
        if (currentQuestionIndex > 0) { currentQuestionIndex--; updateUI(); }
    }
    function nextReviewQuestion() {
        if (reviewIndex < reviewIndices.length - 1) { reviewIndex++; updateUI(); }
    }
    function prevReviewQuestion() {
        if (reviewIndex > 0) { reviewIndex--; updateUI(); }
    }

    function finishExam() {
        clearInterval(timerInterval);
        isExamFinished = true;
        let correctCount = 0;
        let unsureCount = 0;
        reviewIndices = [];

        examQuestions.forEach((q, index) => {
            const isCorrect = userAnswers[index] === q.correct;
            const isUnsure = userUnsure[index];

            if (isCorrect) correctCount++;
            if (isUnsure) unsureCount++;

            // İnceleme listesine ekleme mantığı:
            // 1. Yanlış cevaplar
            // 2. Doğru ama "Emin Değilim" denilen cevaplar
            if (!isCorrect || (isCorrect && isUnsure)) {
                reviewIndices.push(index);
            }
        });

        const score = Math.round((correctCount / examQuestions.length) * 100);
        document.getElementById('main-container').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        
        const scoreCircle = document.getElementById('final-score');
        scoreCircle.innerText = `%${score}`;
        scoreCircle.style.borderColor = score >= 70 ? '#27ae60' : '#c0392b';
        scoreCircle.style.color = score >= 70 ? '#27ae60' : '#c0392b';

        const reviewBtn = document.getElementById('start-review-btn');
        const msg = document.getElementById('result-msg');
        const unsureMsg = document.getElementById('unsure-count-msg');
        
        if (score >= 85) msg.innerText = "Mükemmel! Gerçek sınava hazırsınız.";
        else if (score >= 70) msg.innerText = "Tebrikler, geçtiniz. Ancak %85 üzeri için biraz daha tekrar gerekli.";
        else msg.innerText = "Henüz hazır değilsiniz. Yanlışları analiz edip tekrar deneyin.";

        unsureMsg.innerText = `${unsureCount} soruda emin değildiniz.`;

        if (reviewIndices.length === 0) {
            reviewBtn.style.display = 'none';
            unsureMsg.innerText += " İnceleyecek soru yok, hepsi emin ve doğru!";
        } else {
            reviewBtn.style.display = 'inline-block';
            reviewBtn.innerText = `${reviewIndices.length} Soruyu İncele (Yanlış + Şüpheli)`;
        }
    }

    function startReviewMode() {
        isReviewMode = true;
        reviewIndex = 0;
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('main-container').style.display = 'flex';
        updateUI();
    }
    function returnToResults() {
        document.getElementById('main-container').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
    }
</script>
</body>
</html>
